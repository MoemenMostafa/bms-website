<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta -->
  <title>Bayern Marketing Solutions | Coming Soon</title>
  <meta name="description" content="Bayern Marketing Solutions — a bold marketing and events agency serving Europe and the Middle East. Our new website is coming soon." />
  <meta name="author" content="Bayern Marketing Solutions" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://moemenmostafa.github.io/bms-website/" />

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="manifest" href="favicon/site.webmanifest">

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Bayern Marketing Solutions" />
  <meta property="og:title" content="Bayern Marketing Solutions | Coming Soon" />
  <meta property="og:description" content="Bold marketing strategies and exceptional events that make your brand unforgettable. Our new website is coming soon." />
  <meta property="og:url" content="https://moemenmostafa.github.io/bms-website/" />
  <meta property="og:image" content="https://moemenmostafa.github.io/bms-website/assets/logo-color.png" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Bayern Marketing Solutions | Coming Soon" />
  <meta name="twitter:description" content="Bold marketing strategies and exceptional events that make your brand unforgettable." />
  <meta name="twitter:image" content="https://moemenmostafa.github.io/bms-website/assets/logo-color.png" />

  <!-- Theme -->
  <meta name="theme-color" content="#CC0000" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --red: #CC0000;
      --yellow: #FFC200;
      --dark: #1A1A1A;
      --gray: #6B7280;
      --gradient: linear-gradient(135deg, #FFC200 0%, #CC0000 100%);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      color: var(--dark);
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    html[dir="rtl"] body { font-family: 'Cairo', 'Inter', sans-serif; }

    /* Decorative gradient blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.18;
      z-index: 0;
      pointer-events: none;
    }
    .blob-1 { width: 480px; height: 480px; background: var(--red); top: -160px; right: -120px; }
    .blob-2 { width: 420px; height: 420px; background: var(--yellow); bottom: -140px; left: -120px; }

    /* Language switcher */
    .lang-switcher {
      position: absolute;
      top: 1.5rem;
      inset-inline-end: 1.5rem;
      display: flex;
      gap: 0.35rem;
      z-index: 2;
    }
    .lang-btn {
      background: transparent;
      border: 1.5px solid #d1d5db;
      color: var(--gray);
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.05em;
      font-family: inherit;
    }
    .lang-btn:hover, .lang-btn.active {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }

    /* Main content */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      position: relative;
      z-index: 1;
    }
    .logo img {
      height: 110px;
      width: auto;
      margin-bottom: 2.5rem;
      animation: fadeUp 0.8s ease both;
    }
    h1 {
      font-size: clamp(2.6rem, 7vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.25rem;
      animation: fadeUp 0.8s ease 0.15s both;
    }
    .tagline {
      font-size: clamp(1.05rem, 2.5vw, 1.3rem);
      color: var(--gray);
      max-width: 580px;
      line-height: 1.65;
      margin-bottom: 2.5rem;
      animation: fadeUp 0.8s ease 0.3s both;
    }
    .contact {
      animation: fadeUp 0.8s ease 0.45s both;
    }
    .contact-label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--gray);
      margin-bottom: 0.6rem;
    }
    .contact a {
      display: inline-block;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      background: var(--gradient);
      text-decoration: none;
      padding: 0.8rem 2rem;
      border-radius: 999px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 18px rgba(204, 0, 0, 0.25);
    }
    .contact a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(204, 0, 0, 0.35);
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.82rem;
      color: var(--gray);
      position: relative;
      z-index: 1;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .logo img { height: 84px; }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="lang-switcher" role="group" aria-label="Language">
    <button class="lang-btn active" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="de">DE</button>
    <button class="lang-btn" data-lang="ar">AR</button>
  </div>

  <main>
    <div class="logo">
      <img src="assets/logo-color.png" alt="Bayern Marketing Solutions" />
    </div>
    <h1 data-i18n="heading">Coming Soon</h1>
    <p class="tagline" data-i18n="tagline">Bold marketing strategies and exceptional events that make your brand unforgettable. Our new website is on its way.</p>
    <div class="contact">
      <p class="contact-label" data-i18n="contactLabel">Get in touch</p>
      <a href="mailto:hello@bayernmarketing.de">hello@bayernmarketing.de</a>
    </div>
  </main>

  <footer>
    <span data-i18n="footer">© 2026 Bayern Marketing Solutions. All rights reserved.</span>
  </footer>

  <script>
    const translations = {
      en: {
        heading: 'Coming Soon',
        tagline: 'Bold marketing strategies and exceptional events that make your brand unforgettable. Our new website is on its way.',
        contactLabel: 'Get in touch',
        footer: '© 2026 Bayern Marketing Solutions. All rights reserved.',
        title: 'Bayern Marketing Solutions | Coming Soon'
      },
      de: {
        heading: 'Demnächst',
        tagline: 'Mutige Marketingstrategien und außergewöhnliche Events, die Ihre Marke unvergesslich machen. Unsere neue Website ist in Arbeit.',
        contactLabel: 'Kontaktieren Sie uns',
        footer: '© 2026 Bayern Marketing Solutions. Alle Rechte vorbehalten.',
        title: 'Bayern Marketing Solutions | Demnächst'
      },
      ar: {
        heading: 'قريباً',
        tagline: 'استراتيجيات تسويق جريئة وفعاليات استثنائية تجعل علامتك التجارية لا تُنسى. موقعنا الجديد قادم قريباً.',
        contactLabel: 'تواصل معنا',
        footer: '© 2026 بايرن لحلول التسويق. جميع الحقوق محفوظة.',
        title: 'بايرن لحلول التسويق | قريباً'
      }
    };

    function setLanguage(lang) {
      const t = translations[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.title = t.title;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t[el.dataset.i18n];
      });
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
    });
  </script>
</body>
</html>
